global:
  # every resource lands here, regardless of helm --namespace
  namespace: observability

# Each target scrapes /var/log/pods/<namespace>_<podPattern>/*/*.log
promtailTargets: []
  # Example:
  # - namespace: my-namespace
  #   podPattern: "my-app-*"
  #   labels:
  #     app: my-app
  #   pipeline:
  #     - cri: {}
  #     - json:
  #         expressions:
  #           level: level
  #     - labels:
  #         level:

healthCheckTargets: []
  # - name: database
  #   url: http://postgres:5432
  #   module: tcp_connect

extraScrapeConfigs: ""
  # Example:
  # extraScrapeConfigs: |
  #   - job_name: 'my-exporter'
  #     static_configs:
  #       - targets: ["my-exporter:9187"]

kubeStateMetrics:
  enabled: false
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.10.1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: false
  image:
    repository: prom/node-exporter
    tag: v1.7.0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

storageMonitoring:
  enabled: false
  target: lukscryptwalker-csi-metrics.kube-system.svc:9090

ingressMonitoring:
  enabled: false
  target: ingress-nginx-controller-metrics.ingress-nginx.svc:10254

postgresMonitoring:
  enabled: false
  jobName: postgres
  port: 9187                  # only the container port matching this is kept
  metricsPath: /metrics
  selectorLabel: postgres-operator.crunchydata.com/crunchy-postgres-exporter
  selectorValue: "true"       # empty: match the label with any value
  namespaces: []
  # metricRelabelConfigs: |
  #   - source_labels: [__name__]
  #     action: drop
  #     regex: (pg|ccp)_(stat|statio)_user_tables_.*
  metricRelabelConfigs: ""

containerMonitoring:
  enabled: false
  jobName: kubelet
  metricsPath: /metrics/resource
  insecureSkipVerify: true
  metricRelabelConfigs: ""

discovery:
  enabled: false
  namespaces: []
  podLabels: {}
  extraRelabelConfigs: ""
  containerLabel: false       # true splits one annotated endpoint into one target per container

  probes:
    enabled: true

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.48.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

  storage:
    size: 5Gi
    storageClassName: ""

  retention: 15d
  scrapeInterval: 15s

  sidecar:
    enabled: true
    image: kiwigrid/k8s-sidecar:1.27.4
    rulesLabel: prometheus_rules
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  rulesConfigMaps: []

  alerts: false

  service:
    type: ClusterIP
    port: 9090

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "2.9.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  storage:
    size: 5Gi
    storageClassName: ""

  retention: 168h

  limits:
    maxLabelValueLength: 128    # Loki default: 2048
    maxStreamsPerUser: 5000     # Loki default: 0 (unlimited)
    maxLabelNamesPerSeries: 15  # Loki default: 30
  # highest-priority match wins; unmatched streams fall back to `retention`.
  # the selector must use an indexed stream label (env, product, namespace...)
  retentionStreams: []
    # - selector: '{env="preprod"}'
    #   priority: 1
    #   period: 168h

  objectStore:
    enabled: false
    bucket: ""
    endpoint: ""          # host only, no scheme
    region: ""
    # a FUTURE 00:00 UTC date. Existing chunks stay on the filesystem and keep being
    # served; only data after this boundary goes to the bucket.
    from: ""
    forcePathStyle: false
    insecure: false
    existingSecret: ""
    secretKeys:
      accessKeyId: access-key-id
      secretAccessKey: secret-access-key
    accessKeyId: ""
    secretAccessKey: ""

  service:
    type: ClusterIP
    port: 3100

tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.3.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  storage:
    size: 5Gi
    storageClassName: ""

  service:
    type: ClusterIP
    port: 3200
    otlpGrpcPort: 4317
    otlpHttpPort: 4318

alloy:
  enabled: true
  image:
    repository: grafana/alloy
    tag: v1.4.2
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  service:
    type: ClusterIP
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
    faroPort: 12347
    httpPort: 12345
    lokiPushPort: 3100

  otlp:
    # resource attr -> label on pushed telemetry
    resourceLabels: {}
      # env: env
      # product: product

  faro:
    labels:
      app_environment: env
      app_name: product
      kind: kind
    maxLabelValueLength: 64
    apiKey: ""

  logs:
    enabled: true
    # pods declare their format: beacon/logs: json
    formatAnnotation: beacon/logs
    json:
      # JSON field -> Loki label. Never map a free-text field; the cardinality is unbounded.
      labels:
        level: level
        type: type
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi

  ingress:
    enabled: false
    className: nginx
    host: example.com
    path: /monitoring/alloy/faro(/|$)(.*)
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/use-regex: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      secretName: alloy-faro-tls

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "2.9.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  logPath: /var/log/pods

blackboxExporter:
  enabled: true
  image:
    repository: prom/blackbox-exporter
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

  service:
    type: ClusterIP
    port: 9115

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.4.4"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  storage:
    size: 1Gi
    storageClassName: ""

  admin:
    user: admin
    password: ""

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: nginx
    host: example.com
    path: /monitoring/grafana
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      secretName: grafana-tls

  rootUrl: https://example.com/monitoring/grafana
  serveFromSubPath: true
  defaultTheme: dark
  anonymousEnabled: false

  dashboardFolder: "Dashboards"

  authProxy:
    enabled: false
    # endpoint echoing current user
    validateUrl: ""
    usernameField: username
    userHeader: X-WEBAUTH-USER
    # app login page; empty means 401
    signinUrl: ""
    # who may set the header
    whitelist: ""
    defaultRole: Viewer
    image: python:3.12-alpine
    service:
      port: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  sidecar:
    enabled: true
    image: kiwigrid/k8s-sidecar:1.27.4
    dashboardLabel: grafana_dashboard
    alertingLabel: grafana_alerting
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  podSecurityContext:
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    fsGroupChangePolicy: OnRootMismatch

  dashboardConfigMaps: []
    # - grafana-dashboard-myproject
  alertingConfigMaps: []
    # - grafana-alerting-myproject
