# Global configuration
global:
  # Namespace where all resources will be deployed
  namespace: observability

  # Domain configuration
  domain: example.com
  basePath: /monitoring

  # Application name for labels (used in some default targets)
  appName: my-app

# Promtail log collection targets
promtailTargets:
  # Example: Collect logs from your backend pods
  - namespace: default
    podPattern: "*backend*"
    labels:
      app: backend
  # Add more targets as needed:
  # - namespace: production
  #   podPattern: "*api*"
  #   labels:
  #     app: api-service

# Health check targets for Blackbox Exporter
healthCheckTargets:
  # Example: Monitor your backend service health endpoint
  - name: backend
    url: http://backend:80/health
    module: http_2xx
  # Add more health checks:
  # - name: api
  #   url: http://api-service:80/healthz
  #   module: http_2xx
  # - name: database
  #   url: http://postgres:5432
  #   module: tcp_connect

storageMonitoring:
  enabled: false
  target: lukscryptwalker-csi-metrics.kube-system.svc:9090

# Prometheus configuration
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.48.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

  storage:
    size: 5Gi
    storageClassName: ""  # Use default storage class

  retention: 15d
  scrapeInterval: 15s

  service:
    type: ClusterIP
    port: 9090

# Loki configuration
loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "2.9.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  storage:
    size: 5Gi
    storageClassName: ""

  retention: 168h  # 7 days

  service:
    type: ClusterIP
    port: 3100

# Tempo configuration
tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.3.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  storage:
    size: 5Gi
    storageClassName: ""

  service:
    type: ClusterIP
    port: 3200
    otlpGrpcPort: 4317
    otlpHttpPort: 4318

# Grafana Alloy configuration
alloy:
  enabled: true
  image:
    repository: grafana/alloy
    tag: v1.4.2
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  service:
    type: ClusterIP
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
    faroPort: 12347
    httpPort: 12345
    lokiPushPort: 3100

# Promtail configuration
promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "2.9.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Promtail runs as DaemonSet
  logPath: /var/log/pods

# Blackbox Exporter configuration
blackboxExporter:
  enabled: true
  image:
    repository: prom/blackbox-exporter
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

  service:
    type: ClusterIP
    port: 9115

# Grafana configuration
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.4.4"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  storage:
    size: 1Gi
    storageClassName: ""

  admin:
    user: admin
    password: admin  # CHANGE IN PRODUCTION!

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: nginx
    host: example.com
    path: /monitoring/grafana
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      secretName: grafana-tls

  # Server configuration
  rootUrl: https://example.com/monitoring/grafana
  serveFromSubPath: true
  defaultTheme: dark
  anonymousEnabled: false
