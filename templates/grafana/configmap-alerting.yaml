{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "grafana" | nindent 4 }}
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: webhook-alerts
        receivers:
          - uid: webhook-001
            type: webhook
            settings:
              url: https://example.com/webhook
              httpMethod: POST
            disableResolveMessage: false

      - orgId: 1
        name: email-alerts
        receivers:
          - uid: email-001
            type: email
            settings:
              addresses: admin@example.com
              singleEmail: false
            disableResolveMessage: false

      - orgId: 1
        name: slack-alerts
        receivers:
          - uid: slack-001
            type: slack
            settings:
              url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
              recipient: "#alerts"
              username: Grafana
              icon_emoji: ":warning:"
              text: |
                {{ "{{" }} define "alert_severity_prefix_emoji" -}}
                  {{ "{{-" }} if eq .Status "firing" -}}
                    {{ "{{-" }} if eq (index .Labels "severity") "critical" -}}🔴
                    {{ "{{-" }} else if eq (index .Labels "severity") "warning" -}}⚠️
                    {{ "{{-" }} else -}}ℹ️{{ "{{-" }} end -}}
                  {{ "{{-" }} else -}}✅{{ "{{-" }} end -}}
                {{ "{{-" }} end }}
                {{ "{{" }} template "alert_severity_prefix_emoji" . }} {{ "{{" }} .Status | toUpper }}{{ "{{" }} if eq .Status "firing" }}:{{ "{{" }} .Alerts.Firing | len }}{{ "{{" }} end }}
                {{ "{{" }} range .Alerts -}}
                *Alert:* {{ "{{" }} .Labels.alertname }}
                *Summary:* {{ "{{" }} .Annotations.summary }}
                *Description:* {{ "{{" }} .Annotations.description }}
                {{ "{{" }} if .Annotations.dashboard }}*Dashboard:* {{ "{{" }} .Annotations.dashboard }}{{ "{{" }} end }}
                {{ "{{" }} end }}
            disableResolveMessage: false

  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: slack-alerts
        group_by: ['alertname', 'severity']
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: slack-alerts
            matchers:
              - severity = "critical"
            group_wait: 5s
            group_interval: 2m
            repeat_interval: 1h
            continue: false

          - receiver: slack-alerts
            matchers:
              - severity = "warning"
            group_wait: 30s
            group_interval: 10m
            repeat_interval: 12h
            continue: false

  alertrules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: ODD Critical Alerts
        folder: ODD Alerts
        interval: 30s
        rules:
          - uid: service-down
            title: Backend Service Down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: probe_success{job="health-backend"}
                  instant: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  expression: A
                  type: reduce
                  reducer: last
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  expression: B
                  type: threshold
                  refId: C
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Backend service is down
              description: The backend health check has been failing for more than 1 minute.

      - orgId: 1
        name: ODD Warning Alerts
        folder: ODD Alerts
        interval: 1m
        rules:
          - uid: no-traffic
            title: No Traffic Detected
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: sum(rate(http_request_count_total{job="{{ .Values.global.appName }}-back"}[5m]))
                  instant: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  expression: A
                  type: reduce
                  reducer: last
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  expression: B
                  type: threshold
                  refId: C
                  conditions:
                    - evaluator:
                        type: lt
                        params: [0.001]
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: No HTTP traffic detected
              description: Backend is receiving no requests for the last 10 minutes.

  mutetimings.yaml: |
    apiVersion: 1
    muteTimes:
      - orgId: 1
        name: maintenance-window
        time_intervals:
          - times:
              - start_time: "02:00"
                end_time: "04:00"
            weekdays: ["sunday"]
            location: UTC
{{- end }}
