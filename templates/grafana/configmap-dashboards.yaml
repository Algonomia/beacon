{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-odd
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "grafana" | nindent 4 }}
    grafana_dashboard: "1"
data:
  service-observability.json: |
    {
      "title": "Service Observability",
      "tags": ["service", "observability"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 5,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": { "refresh_intervals": ["10s", "30s", "1m", "5m"], "time_options": ["5m", "15m", "1h", "6h", "24h", "7d"] },
      "panels": [
        { "id": 1, "title": "Requests (10 min)", "type": "stat", "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "sum(increase(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[10m]))", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "blue" }, { "value": 1, "color": "green" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 2, "title": "Error Rate", "type": "stat", "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "(sum(rate(http_request_errors_total{job=\"{{ .Values.global.appName }}-back\"}[5m])) / sum(rate(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[5m]))) * 100", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 2, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" }, { "value": 1, "color": "yellow" }, { "value": 5, "color": "orange" }, { "value": 10, "color": "red" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 3, "title": "P95 Latency", "type": "stat", "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" }, { "value": 200, "color": "yellow" }, { "value": 500, "color": "orange" }, { "value": 1000, "color": "red" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 4, "title": "P99 Latency", "type": "stat", "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" }, { "value": 500, "color": "yellow" }, { "value": 1000, "color": "orange" }, { "value": 2000, "color": "red" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 5, "title": "Health Probes", "type": "stat", "gridPos": { "x": 0, "y": 4, "w": 24, "h": 3 },
          "targets": [
            { "expr": "probe_success{job=\"health-backend\"}", "refId": "backend" },
            { "expr": "probe_success{job=\"health-file-microservice\"}", "refId": "file" },
            { "expr": "probe_success{job=\"health-axtractor\"}", "refId": "axtractor" },
            { "expr": "probe_success{job=\"health-ascraper\"}", "refId": "ascraper" }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ],
            "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "red" }, { "value": 1, "color": "green" } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "textMode": "value" } },

        { "id": 6, "title": "Requests by Endpoint", "type": "timeseries", "gridPos": { "x": 0, "y": 7, "w": 12, "h": 8 },
          "targets": [ { "expr": "topk(10, sum by (route) (increase(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[10m])))", "legendFormat": "{{ "{{" }}route{{ "}}" }}",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 20, "showPoints": "never" } } },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } } },

        { "id": 7, "title": "HTTP Methods", "type": "piechart", "gridPos": { "x": 12, "y": 7, "w": 6, "h": 8 },
          "targets": [ { "expr": "sum by (method) (increase(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "{{ "{{" }}method{{ "}}" }}",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value", "percent"] }, "pieType": "pie", "displayLabels": ["percent"] },
          "fieldConfig": { "overrides": [
            { "matcher": { "id": "byName", "options": "GET" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
            { "matcher": { "id": "byName", "options": "POST" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
            { "matcher": { "id": "byName", "options": "PUT" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
            { "matcher": { "id": "byName", "options": "DELETE" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] } ] } },

        { "id": 8, "title": "Status Codes", "type": "timeseries", "gridPos": { "x": 18, "y": 7, "w": 6, "h": 8 },
          "targets": [
            { "expr": "sum(increase(http_request_count_total{status_code=~\"2..\",job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "2xx", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_count_total{status_code=~\"4..\",job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "4xx", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_count_total{status_code=~\"5..\",job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "5xx", "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 30, "showPoints": "never", "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "2xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "4xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "5xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] } ] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi" } } },

        { "id": 9, "title": "Latency by Endpoint (P95)", "type": "timeseries", "gridPos": { "x": 0, "y": 15, "w": 16, "h": 8 },
          "targets": [ { "expr": "topk(10, histogram_quantile(0.95, sum by (route, le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m]))))", "legendFormat": "{{ "{{" }}route{{ "}}" }}",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 0, "showPoints": "never" }, "color": { "mode": "palette-classic" } } },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } } },

        { "id": 10, "title": "Latency Percentiles", "type": "timeseries", "gridPos": { "x": 16, "y": 15, "w": 8, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p50", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "histogram_quantile(0.90, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p90", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p95", "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p99", "refId": "D", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "p50" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "p90" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "p95" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "p99" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] } ] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi" } } },

        { "id": 11, "title": "Latency Heatmap", "type": "heatmap", "gridPos": { "x": 0, "y": 23, "w": 24, "h": 6 },
          "targets": [ { "expr": "sum(rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])) by (le)", "format": "heatmap", "legendFormat": "le", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "options": { "calculate": false, "cellGap": 2, "color": { "mode": "scheme", "scheme": "Spectral", "steps": 128 }, "yAxis": { "axisPlacement": "left", "unit": "ms" }, "legend": { "show": true }, "tooltip": { "show": true } } },

        { "id": 12, "title": "Request Duration Distribution", "type": "bargauge", "gridPos": { "x": 0, "y": 29, "w": 24, "h": 4 },
          "targets": [
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"100\"}[10m]))", "legendFormat": "<100ms", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"500\"}[10m])) - sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"100\"}[10m]))", "legendFormat": "100-500ms", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"1000\"}[10m])) - sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"500\"}[10m]))", "legendFormat": "500ms-1s", "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"+Inf\"}[10m])) - sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"1000\"}[10m]))", "legendFormat": ">1s", "refId": "D", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" } ] } } },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true } },

        { "id": 13, "title": "Errors by Endpoint", "type": "table", "gridPos": { "x": 0, "y": 33, "w": 24, "h": 6 },
          "targets": [ { "expr": "topk(10, sum by (route) (increase(http_request_errors_total{job=\"{{ .Values.global.appName }}-back\"}[$__range])))", "format": "table", "instant": true, "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "displayMode": "auto" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "route" }, "properties": [ { "id": "displayName", "value": "Endpoint" }, { "id": "custom.width", "value": 400 } ] },
              { "matcher": { "id": "byName", "options": "Value" }, "properties": [ { "id": "displayName", "value": "Errors" }, { "id": "decimals", "value": 0 } ] } ] },
          "transformations": [ { "id": "organize", "options": { "excludeByName": { "Time": true } } } ],
          "options": { "showHeader": true, "sortBy": [ { "displayName": "Errors", "desc": true } ] } },

        { "id": 14, "title": "Application Logs (OTLP)", "type": "logs", "gridPos": { "x": 0, "y": 39, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "expr": "{job=\"{{ .Values.global.appName }}-back\"}", "refId": "A" } ],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "prettifyLogMessage": true } },

        { "id": 15, "title": "Container Logs (Promtail - stdout/stderr)", "type": "logs", "gridPos": { "x": 0, "y": 47, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "expr": "{app=\"{{ .Values.global.appName }}-back\"}", "refId": "A" } ],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "prettifyLogMessage": true } },

        { "id": 16, "title": "Error Logs (OTLP)", "type": "logs", "gridPos": { "x": 0, "y": 55, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "expr": "{job=\"{{ .Values.global.appName }}-back\", level=\"ERROR\"}", "refId": "A" } ],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "prettifyLogMessage": true } }
      ],
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "style": "dark"
    }
  odd-observability.json: |
    {
      "title": "ODD - Practical Observability",
      "tags": ["odd", "operations", "debugging"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 5,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["10s", "30s", "1m", "5m"],
        "time_options": ["5m", "15m", "1h", "6h", "24h", "7d"]
      },
      "panels": [
        { "id": 1, "title": "Requests (10 min)", "type": "stat", "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "sum(increase(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[10m]))", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "blue" }, { "value": 1, "color": "green" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 2, "title": "Error Rate", "type": "stat", "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "(sum(rate(http_request_errors_total{job=\"{{ .Values.global.appName }}-back\"}[5m])) / sum(rate(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[5m]))) * 100",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 2, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" }, { "value": 1, "color": "yellow" }, { "value": 5, "color": "orange" }, { "value": 10, "color": "red" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 3, "title": "P95 Latency", "type": "stat", "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 0, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" }, { "value": 200, "color": "yellow" }, { "value": 500, "color": "orange" }, { "value": 1000, "color": "red" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 4, "title": "P99 Latency", "type": "stat", "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 0, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" }, { "value": 500, "color": "yellow" }, { "value": 1000, "color": "orange" }, { "value": 2000, "color": "red" } ] } } },
          "options": { "graphMode": "area", "colorMode": "background", "textMode": "value" } },

        { "id": 15, "title": "Backend", "type": "stat", "gridPos": { "x": 0, "y": 4, "w": 6, "h": 3 },
          "targets": [ { "expr": "probe_success{job=\"health-backend\"}", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
            { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } }
          ], "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "red" }, { "value": 1, "color": "green" } ] } } },
          "options": { "graphMode": "none", "colorMode": "background", "textMode": "value" } },

        { "id": 16, "title": "File Service", "type": "stat", "gridPos": { "x": 6, "y": 4, "w": 6, "h": 3 },
          "targets": [ { "expr": "probe_success{job=\"health-file-microservice\"}", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
            { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } }
          ], "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "red" }, { "value": 1, "color": "green" } ] } } },
          "options": { "graphMode": "none", "colorMode": "background", "textMode": "value" } },

        { "id": 17, "title": "Axtractor", "type": "stat", "gridPos": { "x": 12, "y": 4, "w": 6, "h": 3 },
          "targets": [ { "expr": "probe_success{job=\"health-axtractor\"}", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
            { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } }
          ], "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "red" }, { "value": 1, "color": "green" } ] } } },
          "options": { "graphMode": "none", "colorMode": "background", "textMode": "value" } },

        { "id": 18, "title": "Ascraper", "type": "stat", "gridPos": { "x": 18, "y": 4, "w": 6, "h": 3 },
          "targets": [ { "expr": "probe_success{job=\"health-ascraper\"}", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
            { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } }
          ], "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "red" }, { "value": 1, "color": "green" } ] } } },
          "options": { "graphMode": "none", "colorMode": "background", "textMode": "value" } },

        { "id": 5, "title": "Requests by Endpoint", "type": "timeseries", "gridPos": { "x": 0, "y": 7, "w": 12, "h": 8 },
          "targets": [ { "expr": "topk(10, sum by (route) (increase(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[10m])))", "legendFormat": "{{ "{{" }}route{{ "}}" }}",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 20, "showPoints": "never" } } },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" } } },

        { "id": 6, "title": "HTTP Methods", "type": "piechart", "gridPos": { "x": 12, "y": 7, "w": 6, "h": 8 },
          "targets": [ { "expr": "sum by (method) (increase(http_request_count_total{job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "{{ "{{" }}method{{ "}}" }}",
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value", "percent"] },
            "pieType": "pie", "displayLabels": ["percent"] },
          "fieldConfig": { "overrides": [
            { "matcher": { "id": "byName", "options": "GET" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
            { "matcher": { "id": "byName", "options": "POST" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
            { "matcher": { "id": "byName", "options": "PUT" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
            { "matcher": { "id": "byName", "options": "DELETE" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] } ] } },

        { "id": 7, "title": "Status Codes", "type": "timeseries", "gridPos": { "x": 18, "y": 7, "w": 6, "h": 8 },
          "targets": [
            { "expr": "sum(increase(http_request_count_total{status_code=~\"2..\",job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "2xx", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_count_total{status_code=~\"4..\",job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "4xx", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_count_total{status_code=~\"5..\",job=\"{{ .Values.global.appName }}-back\"}[10m]))", "legendFormat": "5xx", "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 30, "showPoints": "never", "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "2xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "4xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "5xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] } ] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi" } } },

        { "id": 8, "title": "Latency by Endpoint (P95)", "type": "timeseries", "gridPos": { "x": 0, "y": 15, "w": 16, "h": 8 },
          "targets": [ { "expr": "topk(10, histogram_quantile(0.95, sum by (route, le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m]))))",
            "legendFormat": "{{ "{{" }}route{{ "}}" }}", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 0, "showPoints": "never" }, "color": { "mode": "palette-classic" } } },
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "max", "lastNotNull"] },
            "tooltip": { "mode": "multi", "sort": "desc" } } },

        { "id": 9, "title": "Latency Percentiles", "type": "timeseries", "gridPos": { "x": 16, "y": 15, "w": 8, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p50", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "histogram_quantile(0.90, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p90", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p95", "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])))", "legendFormat": "p99", "refId": "D", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "p50" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "p90" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "p95" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "p99" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] } ] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi" } } },

        { "id": 10, "title": "Latency Heatmap", "type": "heatmap", "gridPos": { "x": 0, "y": 23, "w": 24, "h": 6 },
          "targets": [ { "expr": "sum(rate(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\"}[5m])) by (le)",
            "format": "heatmap", "legendFormat": "le", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "options": { "calculate": false, "cellGap": 2, "color": { "mode": "scheme", "scheme": "Spectral", "steps": 128 },
            "yAxis": { "axisPlacement": "left", "unit": "ms" }, "legend": { "show": true }, "tooltip": { "show": true } } },

        { "id": 14, "title": "Request Duration Distribution", "type": "bargauge", "gridPos": { "x": 0, "y": 29, "w": 24, "h": 4 },
          "targets": [
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"100\"}[10m]))", "legendFormat": "<100ms", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"500\"}[10m])) - sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"100\"}[10m]))", "legendFormat": "100-500ms", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"1000\"}[10m])) - sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"500\"}[10m]))", "legendFormat": "500ms-1s", "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"+Inf\"}[10m])) - sum(increase(http_request_duration_ms_milliseconds_bucket{job=\"{{ .Values.global.appName }}-back\", le=\"1000\"}[10m]))", "legendFormat": ">1s", "refId": "D", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "value": 0, "color": "green" } ] } } },
          "options": { "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true } },

        { "id": 11, "title": "Errors by Endpoint", "type": "table", "gridPos": { "x": 0, "y": 33, "w": 24, "h": 6 },
          "targets": [ { "expr": "topk(10, sum by (route) (increase(http_request_errors_total{job=\"{{ .Values.global.appName }}-back\"}[$__range])))", "format": "table", "instant": true,
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } } ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "displayMode": "auto" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "route" }, "properties": [ { "id": "displayName", "value": "Endpoint" }, { "id": "custom.width", "value": 400 } ] },
              { "matcher": { "id": "byName", "options": "Value" }, "properties": [ { "id": "displayName", "value": "Errors" }, { "id": "decimals", "value": 0 } ] } ] },
          "transformations": [ { "id": "organize", "options": { "excludeByName": { "Time": true } } } ],
          "options": { "showHeader": true, "sortBy": [ { "displayName": "Errors", "desc": true } ] } },

        { "id": 12, "title": "Application Logs (OTLP)", "type": "logs", "gridPos": { "x": 0, "y": 39, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [ { "expr": "{job=\"{{ .Values.global.appName }}-back\"}", "refId": "A" } ],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "prettifyLogMessage": true } },

        { "id": 13, "title": "Container Logs (Promtail - stdout/stderr)", "type": "logs", "gridPos": { "x": 0, "y": 47, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [ { "expr": "{app=\"{{ .Values.global.appName }}-back\"}", "refId": "A" } ],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "prettifyLogMessage": true } },

        { "id": 14, "title": "Error Logs (OTLP)", "type": "logs", "gridPos": { "x": 0, "y": 55, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [ { "expr": "{job=\"{{ .Values.global.appName }}-back\", level=\"ERROR\"}", "refId": "A" } ],
          "options": { "showTime": true, "showLabels": false, "sortOrder": "Descending", "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "prettifyLogMessage": true } }
      ],
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "style": "dark"
    }
