{{- if .Values.grafana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "grafana" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      annotations:
        checksum/datasources: {{ include (print $.Template.BasePath "/grafana/configmap-datasources.yaml") . | sha256sum }}
        checksum/dashboard-provider: {{ include (print $.Template.BasePath "/grafana/configmap-dashboard-provider.yaml") . | sha256sum }}
      labels:
        app: grafana
    spec:
      {{- if and .Values.discovery.enabled .Values.grafana.sidecar.enabled }}
      serviceAccountName: grafana
      {{- end }}
      {{- with .Values.grafana.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: grafana
        image: {{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}
        imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.grafana.service.port }}
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-password
        - name: GF_SERVER_ROOT_URL
          value: {{ .Values.grafana.rootUrl | quote }}
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: {{ .Values.grafana.serveFromSubPath | quote }}
        - name: GF_USERS_DEFAULT_THEME
          value: {{ .Values.grafana.defaultTheme | quote }}
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: {{ .Values.grafana.anonymousEnabled | quote }}
        {{- if .Values.grafana.authProxy.enabled }}
        - name: GF_AUTH_PROXY_ENABLED
          value: "true"
        - name: GF_AUTH_PROXY_HEADER_NAME
          value: {{ .Values.grafana.authProxy.userHeader | quote }}
        - name: GF_AUTH_PROXY_HEADER_PROPERTY
          value: username
        - name: GF_AUTH_PROXY_AUTO_SIGN_UP
          value: "true"
        # Grafana trusts that header only from these addresses. Empty means it trusts
        # anything that can reach this pod, which is a hole unless a NetworkPolicy closes it.
        - name: GF_AUTH_PROXY_WHITELIST
          value: {{ .Values.grafana.authProxy.whitelist | quote }}
        - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
          value: {{ .Values.grafana.authProxy.defaultRole | quote }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          {{- toYaml .Values.grafana.resources | nindent 10 }}
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        {{- if or .Values.grafana.alertingConfigMaps (and .Values.discovery.enabled .Values.grafana.sidecar.enabled) }}
        - name: alerting
          mountPath: /etc/grafana/provisioning/alerting
        {{- end }}
        # `storage` must be mounted BEFORE `dashboards`, which nests inside it: mounts
        # are applied in the order listed, so mounting the parent second masks the child
        # and Grafana sees an empty dashboards directory while the sidecar, which mounts
        # only the child, happily writes into it. That mismatch is invisible from
        # outside the pod — dashboards simply never provision, with nothing in any log.
        - name: storage
          mountPath: /var/lib/grafana
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
      {{- if and .Values.discovery.enabled .Values.grafana.sidecar.enabled }}
      - name: sidecar-dashboards
        image: {{ .Values.grafana.sidecar.image }}
        env:
          - name: LABEL
            value: {{ .Values.grafana.sidecar.dashboardLabel | quote }}
          - name: FOLDER
            value: /var/lib/grafana/dashboards
          - name: RESOURCE
            value: configmap
          - name: METHOD
            value: WATCH
          - name: NAMESPACE
            value: {{ .Values.discovery.namespaces | default (list) | join "," | default "ALL" | quote }}
        resources:
          {{- toYaml .Values.grafana.sidecar.resources | nindent 10 }}
        volumeMounts:
          - name: dashboards
            mountPath: /var/lib/grafana/dashboards
      - name: sidecar-alerting
        image: {{ .Values.grafana.sidecar.image }}
        env:
          - name: LABEL
            value: {{ .Values.grafana.sidecar.alertingLabel | quote }}
          - name: FOLDER
            value: /etc/grafana/provisioning/alerting
          # Grafana reads alerting provisioning at startup only, so a ConfigMap
          # discovered later is written to disk and then ignored until something asks
          # for a reload. Dashboards need no equivalent: their file provider polls.
          - name: REQ_URL
            value: http://localhost:{{ .Values.grafana.service.port }}/api/admin/provisioning/alerting/reload
          - name: REQ_METHOD
            value: POST
          - name: REQ_USERNAME
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-user
          - name: REQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-password
          - name: RESOURCE
            value: configmap
          - name: METHOD
            value: WATCH
          - name: NAMESPACE
            value: {{ .Values.discovery.namespaces | default (list) | join "," | default "ALL" | quote }}
        resources:
          {{- toYaml .Values.grafana.sidecar.resources | nindent 10 }}
        volumeMounts:
          - name: alerting
            mountPath: /etc/grafana/provisioning/alerting
      {{- end }}
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      {{- if and .Values.discovery.enabled .Values.grafana.sidecar.enabled }}
      - name: dashboards
        emptyDir: {}
      - name: alerting
        emptyDir: {}
      {{- else }}
      - name: dashboards
        projected:
          sources:
          {{- if .Values.grafana.dashboardConfigMaps }}
          {{- range .Values.grafana.dashboardConfigMaps }}
            - configMap:
                name: {{ . }}
                optional: true
          {{- end }}
          {{- else }}
            []
          {{- end }}
      {{- if .Values.grafana.alertingConfigMaps }}
      - name: alerting
        projected:
          sources:
          {{- range .Values.grafana.alertingConfigMaps }}
            - configMap:
                name: {{ . }}
                optional: true
          {{- end }}
      {{- end }}
      {{- end }}
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-storage
{{- end }}
