{{- if .Values.grafana.enabled }}
{{- $existing := lookup "v1" "Secret" (include "beacon.namespace" .) "grafana-admin" }}
{{- $password := .Values.grafana.admin.password }}
{{- if not $password }}
  {{- if and $existing $existing.data }}
    {{- $password = index $existing.data "admin-password" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 24 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "grafana" | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.admin.user | quote }}
  admin-password: {{ $password | quote }}
{{- end }}
