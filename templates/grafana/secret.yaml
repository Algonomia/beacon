{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "grafana" | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.admin.user | quote }}
  admin-password: {{ .Values.grafana.admin.password | quote }}
{{- end }}
