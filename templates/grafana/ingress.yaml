{{- if and .Values.grafana.enabled .Values.grafana.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "grafana" | nindent 4 }}
  annotations:
    {{- toYaml .Values.grafana.ingress.annotations | nindent 4 }}
    {{- if .Values.grafana.authProxy.enabled }}
    {{- $ns := include "beacon.namespace" . }}
    nginx.ingress.kubernetes.io/auth-url: "http://grafana-auth-shim.{{ $ns }}.svc.cluster.local:{{ .Values.grafana.authProxy.service.port }}/"
    nginx.ingress.kubernetes.io/auth-response-headers: {{ .Values.grafana.authProxy.userHeader | quote }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_input_headers {{ .Values.grafana.authProxy.userHeader | quote }};
    {{- with .Values.grafana.authProxy.signinUrl }}
    nginx.ingress.kubernetes.io/auth-signin: {{ . | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.grafana.ingress.className }}
  {{- if .Values.grafana.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.grafana.ingress.host }}
      secretName: {{ .Values.grafana.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.grafana.ingress.host }}
    http:
      paths:
      - path: {{ .Values.grafana.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: {{ .Values.grafana.service.port }}
{{- end }}
