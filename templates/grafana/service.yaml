{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "grafana" | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: http
      name: http
      protocol: TCP
  selector:
    app: grafana
{{- end }}
