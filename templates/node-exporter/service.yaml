{{- if .Values.nodeExporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "node-exporter" | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 9100
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: node-exporter
{{- end }}
