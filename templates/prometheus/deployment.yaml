{{- if .Values.prometheus.enabled }}
{{- $ruleConfigMaps := .Values.prometheus.rulesConfigMaps | default list }}
{{- if and (not $ruleConfigMaps) .Values.prometheus.alerts }}
{{- $ruleConfigMaps = list "prometheus-alerts" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "prometheus" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus/configmap.yaml") . | sha256sum }}
      labels:
        app: prometheus
    spec:
      {{- if .Values.discovery.enabled }}
      serviceAccountName: prometheus
      {{- end }}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time={{ .Values.prometheus.retention }}'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--web.enable-remote-write-receiver'
            - '--web.enable-lifecycle'
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
            {{- if or $ruleConfigMaps (and .Values.discovery.enabled .Values.prometheus.sidecar.enabled) }}
            - name: alerts
              mountPath: /etc/prometheus/alerts
            {{- end }}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
        {{- if and .Values.discovery.enabled .Values.prometheus.sidecar.enabled }}
        - name: sidecar-rules
          image: {{ .Values.prometheus.sidecar.image }}
          env:
            - name: LABEL
              value: {{ .Values.prometheus.sidecar.rulesLabel | quote }}
            - name: FOLDER
              value: /etc/prometheus/alerts
            - name: RESOURCE
              value: configmap
            - name: METHOD
              value: WATCH
            - name: NAMESPACE
              value: {{ .Values.discovery.namespaces | default (list) | join "," | default "ALL" | quote }}
            - name: REQ_URL
              value: http://localhost:9090/-/reload
            - name: REQ_METHOD
              value: POST
          resources:
            {{- toYaml .Values.prometheus.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: alerts
              mountPath: /etc/prometheus/alerts
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-storage
        {{- if and .Values.discovery.enabled .Values.prometheus.sidecar.enabled }}
        - name: alerts
          emptyDir: {}
        {{- else if $ruleConfigMaps }}
        - name: alerts
          projected:
            sources:
            {{- range $ruleConfigMaps }}
              - configMap:
                  name: {{ . }}
                  optional: true
            {{- end }}
        {{- end }}
{{- end }}
