{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "prometheus" | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.scrapeInterval }}

    rule_files:
      - '/etc/prometheus/alerts/*.yml'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      {{- if .Values.discovery.enabled }}
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            {{- with .Values.discovery.namespaces }}
            namespaces:
              names:
                {{- toYaml . | nindent 16 }}
            {{- end }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: (Failed|Succeeded)
          {{- if .Values.postgresMonitoring.enabled }}
          # exporter pods usually carry the scrape annotation too: without this, both jobs store it
          - source_labels: [__meta_kubernetes_pod_label_{{ .Values.postgresMonitoring.selectorLabel | replace "-" "_" | replace "." "_" | replace "/" "_" }}]
            action: drop
            regex: {{ .Values.postgresMonitoring.selectorValue | default ".+" | quote }}
          {{- end }}
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          {{- if .Values.discovery.containerLabel }}
          # see values.yaml discovery.containerLabel
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          {{- end }}
          {{- range $target, $src := .Values.discovery.podLabels }}
          - source_labels: [__meta_kubernetes_pod_label_{{ $src | replace "-" "_" | replace "." "_" | replace "/" "_" }}]
            target_label: {{ $target }}
            regex: (.+)
            action: replace
          {{- end }}
          {{- with .Values.discovery.extraRelabelConfigs }}
          {{- tpl . $ | nindent 10 }}
          {{- end }}
      {{- end }}

      {{- if .Values.alloy.enabled }}
      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy:{{ .Values.alloy.service.httpPort }}']
      {{- end }}

      {{- if .Values.tempo.enabled }}
      - job_name: 'tempo'
        static_configs:
          - targets: ['tempo:{{ .Values.tempo.service.port }}']
      {{- end }}

      {{- if .Values.loki.enabled }}
      - job_name: 'loki'
        static_configs:
          - targets: ['loki:{{ .Values.loki.service.port }}']
      {{- end }}

      {{- if .Values.blackboxExporter.enabled }}
      - job_name: 'blackbox-exporter'
        static_configs:
          - targets: ['blackbox-exporter:{{ .Values.blackboxExporter.service.port }}']

      # Health check probes via Blackbox Exporter
      {{- range .Values.healthCheckTargets }}
      - job_name: 'health-{{ .name }}'
        metrics_path: /probe
        params:
          module: [{{ .module }}]
        static_configs:
          - targets:
            - {{ .url }}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:{{ $.Values.blackboxExporter.service.port }}
      {{- end }}

      {{- if and .Values.discovery.enabled .Values.discovery.probes.enabled }}
      # see values.yaml discovery.probes
      - job_name: 'blackbox-discovered'
        metrics_path: /probe
        kubernetes_sd_configs:
          - role: service
            {{- with .Values.discovery.namespaces }}
            namespaces:
              names:
                {{- toYaml . | nindent 16 }}
            {{- end }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
            action: keep
            regex: "true"
          - target_label: __param_module
            replacement: http_2xx
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe_module]
            regex: (.+)
            target_label: __param_module
            replacement: $1
          - source_labels: [__address__]
            target_label: __param_target
            replacement: http://$1/health
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_probe_path]
            regex: (.+);(.+)
            target_label: __param_target
            replacement: http://$1$2
          - source_labels: [__param_target]
            target_label: instance
          - source_labels: [__meta_kubernetes_service_name]
            target_label: job
            replacement: health-$1
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe_name]
            regex: (.+)
            target_label: job
            replacement: health-$1
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          {{- range $target, $src := .Values.discovery.podLabels }}
          - source_labels: [__meta_kubernetes_service_label_{{ $src | replace "-" "_" | replace "." "_" | replace "/" "_" }}]
            target_label: {{ $target }}
            regex: (.+)
            action: replace
          {{- end }}
          - target_label: __address__
            replacement: blackbox-exporter:{{ .Values.blackboxExporter.service.port }}
      {{- end }}
      {{- end }}

      {{- if .Values.storageMonitoring.enabled }}
      - job_name: 'lukscryptwalker-csi'
        metrics_path: /metrics
        static_configs:
          - targets: ['{{ .Values.storageMonitoring.target }}']
      {{- end }}

      {{- if .Values.kubeStateMetrics.enabled }}
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']
      {{- end }}

      {{- if .Values.nodeExporter.enabled }}
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
      {{- end }}

      {{- if .Values.containerMonitoring.enabled }}
      - job_name: {{ .Values.containerMonitoring.jobName | default "kubelet" | quote }}
        scheme: https
        metrics_path: {{ .Values.containerMonitoring.metricsPath | default "/metrics/resource" }}
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: {{ .Values.containerMonitoring.insecureSkipVerify | default true }}
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        {{- with .Values.containerMonitoring.metricRelabelConfigs }}
        metric_relabel_configs:
          {{- tpl . $ | nindent 10 }}
        {{- end }}
      {{- end }}

      {{- if .Values.ingressMonitoring.enabled }}
      - job_name: 'nginx-ingress'
        metrics_path: /metrics
        static_configs:
          - targets: ['{{ .Values.ingressMonitoring.target }}']
      {{- end }}

      {{- if .Values.postgresMonitoring.enabled }}
      # see values.yaml postgresMonitoring
      - job_name: {{ .Values.postgresMonitoring.jobName | quote }}
        metrics_path: {{ .Values.postgresMonitoring.metricsPath }}
        kubernetes_sd_configs:
          - role: pod
            {{- with .Values.postgresMonitoring.namespaces }}
            namespaces:
              names:
                {{- toYaml . | nindent 16 }}
            {{- end }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_{{ .Values.postgresMonitoring.selectorLabel | replace "-" "_" | replace "." "_" | replace "/" "_" }}]
            action: keep
            regex: {{ .Values.postgresMonitoring.selectorValue | default ".+" | quote }}
          # one target per pod: the port is a literal here, unlike the annotation-driven job above
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: {{ .Values.postgresMonitoring.port | quote }}
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: (Failed|Succeeded)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          {{- range $target, $src := .Values.discovery.podLabels }}
          - source_labels: [__meta_kubernetes_pod_label_{{ $src | replace "-" "_" | replace "." "_" | replace "/" "_" }}]
            target_label: {{ $target }}
            regex: (.+)
            action: replace
          {{- end }}
        {{- with .Values.postgresMonitoring.metricRelabelConfigs }}
        metric_relabel_configs:
          {{- tpl . $ | nindent 10 }}
        {{- end }}
      {{- end }}

      {{- if .Values.extraScrapeConfigs }}
{{ .Values.extraScrapeConfigs | indent 6 }}
      {{- end }}
{{- end }}
