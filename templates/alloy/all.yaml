{{- if .Values.alloy.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "alloy" | nindent 4 }}
data:
  config.alloy: |

    otelcol.receiver.otlp "backend" {
      grpc {
        endpoint = "0.0.0.0:{{ .Values.alloy.service.otlpGrpcPort }}"
      }

      http {
        endpoint = "0.0.0.0:{{ .Values.alloy.service.otlpHttpPort }}"
        cors {
          allowed_origins = ["*"]
        }
      }

      output {
        {{- if .Values.alloy.otlp.resourceLabels }}
        metrics = [otelcol.processor.transform.identity.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
        logs    = [otelcol.processor.transform.identity.input]
        {{- else }}
        metrics = [otelcol.exporter.prometheus.default.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
        logs    = [otelcol.exporter.loki.default.input]
        {{- end }}
      }
    }

    {{- if .Values.alloy.otlp.resourceLabels }}

    otelcol.processor.transform "identity" {
      error_mode = "ignore"

      metric_statements {
        context = "datapoint"
        statements = [
          {{- range $attr, $label := .Values.alloy.otlp.resourceLabels }}
          `set(attributes["{{ $label }}"], resource.attributes["{{ $attr }}"])`,
          {{- end }}
        ]
      }

      log_statements {
        context = "resource"
        statements = [
          {{- range $attr, $label := .Values.alloy.otlp.resourceLabels }}
          {{- if ne $attr $label }}
          `set(attributes["{{ $label }}"], attributes["{{ $attr }}"])`,
          {{- end }}
          {{- end }}
          `set(attributes["loki.resource.labels"], "{{ values .Values.alloy.otlp.resourceLabels | sortAlpha | join "," }}")`,
        ]
      }

      output {
        metrics = [otelcol.exporter.prometheus.default.input]
        logs    = [otelcol.exporter.loki.default.input]
      }
    }
    {{- end }}

    loki.source.api "promtail" {
      http {
        listen_address = "0.0.0.0"
        listen_port = {{ .Values.alloy.service.lokiPushPort }}
      }
      forward_to = [loki.write.default.receiver]
      // Keep labels sent by Promtail (app, namespace, etc.)
    }

    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "http://prometheus:{{ .Values.prometheus.service.port }}/api/v1/write"
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo:{{ .Values.tempo.service.otlpGrpcPort }}"
        tls {
          insecure = true
        }
      }
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:{{ .Values.loki.service.port }}/loki/api/v1/push"
      }
    }

    faro.receiver "default" {
      server {
        listen_address = "0.0.0.0"
        listen_port = {{ .Values.alloy.service.faroPort }}
        cors_allowed_origins = ["*"]
        {{- if and .Values.alloy.faro .Values.alloy.faro.apiKey }}
        api_key = {{ .Values.alloy.faro.apiKey | quote }}
        {{- end }}
      }

      output {
        logs   = [loki.process.faro.receiver]
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    loki.process "faro" {
      stage.static_labels {
        values = {
          job      = "faro",
          source   = "frontend",
        }
      }
      {{- if and .Values.alloy.faro .Values.alloy.faro.labels }}
      {{- range $field, $label := .Values.alloy.faro.labels }}
      {{- if not (regexMatch "^[a-zA-Z_][a-zA-Z0-9_]*$" (toString $label)) }}
      {{- fail (printf "alloy.faro.labels: %q is not a valid Loki label name (expected ^[a-zA-Z_][a-zA-Z0-9_]*$). A name with a dash, space or quote renders a config Alloy refuses to load, which crashloops the whole alloy Deployment." $label) }}
      {{- end }}
      {{- end }}

      stage.logfmt {
        mapping = {
          {{- range $field, $label := .Values.alloy.faro.labels }}
          {{ $label }} = {{ $field | quote }},
          {{- end }}
        }
      }

      {{- if .Values.alloy.faro.maxLabelValueLength }}
      {{- range $field, $label := .Values.alloy.faro.labels }}
      stage.template {
        source   = {{ $label | quote }}
        template = "{{ `{{ .Value | trunc ` }}{{ $.Values.alloy.faro.maxLabelValueLength }}{{ ` }}` }}"
      }
      {{- end }}
      {{- end }}

      stage.labels {
        values = {
          {{- range $field, $label := .Values.alloy.faro.labels }}
          {{ $label }} = "",
          {{- end }}
        }
      }
      {{- end }}

      forward_to = [loki.write.default.receiver]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "alloy" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      annotations:
        checksum/config: {{ include "beacon.configChecksum" (list .Values.alloy .Values.loki.service.port .Values.prometheus.service.port .Values.tempo.service.otlpGrpcPort) }}
      labels:
        app: alloy
    spec:
      containers:
        - name: alloy
          image: {{ .Values.alloy.image.repository }}:{{ .Values.alloy.image.tag }}
          imagePullPolicy: {{ .Values.alloy.image.pullPolicy }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:{{ .Values.alloy.service.httpPort }}
            - --storage.path=/var/lib/alloy/data
          ports:
            - containerPort: {{ .Values.alloy.service.otlpGrpcPort }}
              name: otlp-grpc
            - containerPort: {{ .Values.alloy.service.otlpHttpPort }}
              name: otlp-http
            - containerPort: {{ .Values.alloy.service.httpPort }}
              name: http
            - containerPort: {{ .Values.alloy.service.lokiPushPort }}
              name: loki-push
            - containerPort: {{ .Values.alloy.service.faroPort }}
              name: faro
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "alloy" | nindent 4 }}
spec:
  type: {{ .Values.alloy.service.type }}
  selector:
    app: alloy
  ports:
    - port: {{ .Values.alloy.service.otlpGrpcPort }}
      targetPort: otlp-grpc
      name: otlp-grpc
      protocol: TCP
    - port: {{ .Values.alloy.service.otlpHttpPort }}
      targetPort: otlp-http
      name: otlp-http
      protocol: TCP
    - port: {{ .Values.alloy.service.httpPort }}
      targetPort: http
      name: http
      protocol: TCP
    - port: {{ .Values.alloy.service.lokiPushPort }}
      targetPort: loki-push
      name: loki-push
      protocol: TCP
    - port: {{ .Values.alloy.service.faroPort }}
      targetPort: faro
      name: faro
      protocol: TCP
{{- end }}
