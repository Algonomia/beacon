{{- if and .Values.alloy.enabled .Values.alloy.ingress.enabled }}
{{- $ingress := .Values.alloy.ingress }}
{{- $hosts := $ingress.hosts | default (list) }}
{{- if $ingress.host }}
{{- $hosts = append $hosts $ingress.host }}
{{- end }}
{{- if not $hosts }}
{{- fail "alloy.ingress.enabled is true but neither alloy.ingress.host nor alloy.ingress.hosts is set" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alloy-faro-ingress
  namespace: {{ include "beacon.namespace" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
    {{- include "beacon.componentLabels" "alloy" | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ingress.className }}
  {{- if $ingress.tls }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ $ingress.tls.secretName }}
  {{- end }}
  rules:
  {{- range $hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: {{ $ingress.path }}
        pathType: ImplementationSpecific
        backend:
          service:
            name: alloy
            port:
              number: {{ $.Values.alloy.service.faroPort }}
  {{- end }}
{{- end }}
