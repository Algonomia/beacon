name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint . && helm lint . -f ci/full-values.yaml
      - run: helm template beacon . > /dev/null && helm template beacon . -f ci/full-values.yaml > /dev/null

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          config: ci/kind.yaml
      - name: Install with every component on
        run: |
          kubectl apply -f ci/demo-app.yaml
          helm install beacon . -n observability --create-namespace -f ci/full-values.yaml --wait --timeout 10m
      - name: Smoke test
        run: ci/smoke.sh
      - name: Debug
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n observability describe pods | tail -n 200
          kubectl -n observability logs --all-containers --prefix --tail=40 -l app.kubernetes.io/instance=beacon || true
